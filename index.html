<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>น้องเผือก ข่าวรถไฟฟ้า</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Mood: หรู สะอาด เป็นทางการ แบบหน้า landing ของร้านอาหารระดับพรีเมียม
   Layout: Hero มืดแบบซุ้มโค้งพร้อมภาพข่าวล่าสุด → หมวดข่าว (เหมือนหมวดเมนู) → รายการข่าวแบบแกลเลอรีการ์ดภาพ + แถบค้นหาย้อนหลัง → เกี่ยวกับน้องเผือก → ท้ายหน้า
   Color: ม่วงเผือกเข้ม + ทองอ่อนเป็นสีเน้น · พื้นเนื้อหาโทนงาช้างอมม่วง · หมวดข่าวใช้ แดง/เหลือง/เขียว/เทา แยกกรอบชัด */
:root {
  --bg: #F8F5FB; --surface: #FFFFFF; --surface-2: #F1ECF7; --fg: #241C33; --muted: #6B627B; --line: #E2DAEE;
  --brand: #5B3F94; --brand-fg: #FFFFFF; --brand-soft: #EAE2F6;
  --gold: #B88A2E;
  --red: #C62828; --red-bg: #FDECEC; --red-bd: #EFA6A6;
  --amber: #A86200; --amber-bg: #FFF3D6; --amber-bd: #EBC15F;
  --green: #2E7D32; --green-bg: #E6F4E7; --green-bd: #96CC99;
  --grey: #5F6368; --grey-bg: #EEF0F2; --grey-bd: #BDC2C8;
  --night: #1D1430; --night-2: #2A1D45; --night-fg: #F4EEFB; --night-muted: #BBAED1; --night-gold: #E3C377;
  --serif: "Playfair Display", "Noto Serif Thai", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16111F; --surface: #211A30; --surface-2: #2A2240; --fg: #EFE9F8; --muted: #A99FBD; --line: #3A3052;
    --brand: #BBA5F2; --brand-fg: #1B1429; --brand-soft: #352A52; --gold: #E3C377;
    --red: #FF8A80; --red-bg: #3A1F23; --red-bd: #8A3B42;
    --amber: #FFC259; --amber-bg: #392C12; --amber-bd: #8A6A22;
    --green: #81C784; --green-bg: #1C3120; --green-bd: #3F7444;
    --grey: #B0B4BA; --grey-bg: #2A2C30; --grey-bd: #5A5E66; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16111F; --surface: #211A30; --surface-2: #2A2240; --fg: #EFE9F8; --muted: #A99FBD; --line: #3A3052;
  --brand: #BBA5F2; --brand-fg: #1B1429; --brand-soft: #352A52; --gold: #E3C377;
  --red: #FF8A80; --red-bg: #3A1F23; --red-bd: #8A3B42;
  --amber: #FFC259; --amber-bg: #392C12; --amber-bd: #8A6A22;
  --green: #81C784; --green-bg: #1C3120; --green-bd: #3F7444;
  --grey: #B0B4BA; --grey-bg: #2A2C30; --grey-bd: #5A5E66; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 12px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15.5px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 12px; }
.eyebrow::before { content: ""; width: 36px; height: 1.5px; background: currentColor; }
h1, h2, h3 { font-family: var(--serif); }
.sec { padding-block: clamp(44px, 8vw, 84px); }
.sec-head { text-align: center; display: grid; gap: 8px; justify-items: center; margin-bottom: 30px; }
.sec-head h2 { margin: 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; }
.sec-head p { margin: 0; color: var(--muted); max-width: 56ch; }
.orn { display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 13px; }
.orn::before, .orn::after { content: ""; width: 54px; height: 1px; background: currentColor; opacity: .7; }

/* ---------- Hero ---------- */
.hero { background: radial-gradient(1200px 520px at 80% 10%, var(--night-2), var(--night)); color: var(--night-fg);
  padding-top: max(14px, env(safe-area-inset-top, 0px)); position: relative; overflow: hidden; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.logo { width: 58px; height: 58px; border-radius: 50%; flex: none; background: #CFC4F5; display: grid; place-items: center; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo svg { width: 82%; height: 82%; }
.bname { font-family: var(--serif); font-weight: 700; font-size: 22px; line-height: 1.1; }
.bsub { font-size: 12.5px; color: var(--night-muted); line-height: 1.3; }
.links { display: flex; gap: 22px; align-items: center; }
.links a { color: var(--night-fg); text-decoration: none; font-size: 14.5px; opacity: .88; }
.links a:hover { opacity: 1; color: var(--night-gold); }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid rgba(255,255,255,.28); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--night-fg); padding: 5px 13px; cursor: pointer; min-height: 36px; font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--night-gold); color: #2B1E0A; }
.pillbtn { border: 1.5px solid rgba(255,255,255,.28); background: transparent; color: var(--night-fg); border-radius: 999px; padding: 5px 14px; cursor: pointer; min-height: 36px; font-size: 13.5px; }
.pillbtn:hover { border-color: var(--night-gold); }
@media (max-width: 820px) { .links { display: none; } }

.hero-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(20px, 5vw, 56px); align-items: center; padding-block: clamp(26px, 5vw, 56px) 30px; }
.hero .eyebrow { color: var(--night-gold); }
.hero h1 { margin: 14px 0 12px; font-size: clamp(27px, 5.2vw, 50px); line-height: 1.22; font-weight: 700; overflow-wrap: anywhere; text-wrap: balance; }
.hcap { color: var(--night-muted); font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hcap b { color: var(--night-fg); font-weight: 600; }
.hupd { margin-top: 12px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 12px; font-size: 14px; max-width: 60ch; }
.hbtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.btn-gold { background: var(--night-gold); color: #2B1E0A; border-radius: 999px; padding: 11px 24px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; min-height: 46px; border: 0; cursor: pointer; }
.btn-ghost { border: 1.5px solid rgba(255,255,255,.4); color: var(--night-fg); border-radius: 999px; padding: 10px 22px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; min-height: 46px; }
.btn-ghost:hover { border-color: var(--night-gold); color: var(--night-gold); }
.arch { position: relative; width: 100%; aspect-ratio: 4 / 4.6; max-height: 520px; margin-inline: auto; border-radius: 28px; overflow: hidden;
  background: linear-gradient(160deg, #CFC4F5, #A992E6); border: 3px solid rgba(227,195,119,.7); box-shadow: 0 24px 60px rgba(0,0,0,.45); display: grid; place-items: center; }
.arch img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.arch .mascot { width: 74%; max-width: 330px; aspect-ratio: 1; display: block; }
.arch .mascot svg { width: 100%; height: 100%; }
.arch .mascot img { width: 100%; height: 100%; object-fit: contain; }
.arch .tag { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(20,12,35,.78); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 12.5px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 820px) { .hero-grid { grid-template-columns: 1fr; } .arch { max-width: 340px; order: -1; aspect-ratio: 4 / 3.6; border-radius: 28px; } .arch .mascot { width: 58%; } }

.next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-bottom: clamp(24px, 4vw, 40px); }
.nx { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 10px; text-decoration: none; color: inherit; }
.nx:hover { border-color: var(--night-gold); }
.nx .th { width: 76px; height: 76px; border-radius: 12px; overflow: hidden; background: var(--night-2); position: relative; }
.nx .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nx b { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.nx small { color: var(--night-muted); font-size: 12px; display: block; margin-top: 2px; }
@media (max-width: 820px) { .next { grid-template-columns: 1fr; } }

/* ---------- หมวดข่าว ---------- */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cc { text-align: left; cursor: pointer; border: 2px solid var(--cb); background: var(--cg); border-radius: 22px; padding: 20px 18px; display: grid; gap: 8px; align-content: start; min-height: 190px; }
.cc:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(40,20,80,.14); }
.cc .num { font-family: var(--serif); font-size: 46px; font-weight: 700; line-height: 1; color: var(--cc); font-variant-numeric: tabular-nums; }
.cc .nm { font-weight: 700; font-size: 16.5px; }
.cc .ds { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.cc .lt { font-size: 13px; margin-top: auto; border-top: 1px dashed var(--cb); padding-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cc.red { --cb: var(--red-bd); --cg: var(--red-bg); --cc: var(--red); } .cc.yellow { --cb: var(--amber-bd); --cg: var(--amber-bg); --cc: var(--amber); }
.cc.green { --cb: var(--green-bd); --cg: var(--green-bg); --cc: var(--green); } .cc.grey { --cb: var(--grey-bd); --cg: var(--grey-bg); --cc: var(--grey); }
@media (max-width: 900px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cats { grid-template-columns: 1fr; } .cc { min-height: 0; } }

/* ---------- ค้นหา + รายการข่าว ---------- */
.finder { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgba(60,30,110,.07); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tab { border: 2px solid var(--tb); background: var(--tbg); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; font-weight: 500; }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 700; }
.tab[data-c="all"] { --tb: var(--brand); --tbg: var(--brand-soft); } .tab[data-c="red"] { --tb: var(--red-bd); --tbg: var(--red-bg); }
.tab[data-c="yellow"] { --tb: var(--amber-bd); --tbg: var(--amber-bg); } .tab[data-c="green"] { --tb: var(--green-bd); --tbg: var(--green-bg); }
.tab[data-c="grey"] { --tb: var(--grey-bd); --tbg: var(--grey-bg); }
.tab[aria-pressed="true"] { color: #fff; }
.tab[aria-pressed="true"][data-c="all"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.tab[aria-pressed="true"][data-c="red"] { background: var(--red); border-color: var(--red); } .tab[aria-pressed="true"][data-c="yellow"] { background: var(--amber); border-color: var(--amber); }
.tab[aria-pressed="true"][data-c="green"] { background: var(--green); border-color: var(--green); } .tab[aria-pressed="true"][data-c="grey"] { background: var(--grey); border-color: var(--grey); }
:root[data-theme="dark"] .tab[aria-pressed="true"]:not([data-c="all"]) { color: #1B1429; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-pressed="true"]:not([data-c="all"]) { color: #1B1429; } }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; background: currentColor; }
.d-red { color: var(--red); } .d-yellow { color: var(--amber); } .d-green { color: var(--green); } .d-grey { color: var(--grey); } .d-all { color: var(--brand); }
.tab[aria-pressed="true"] .dot { color: currentColor; }
.search { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.search label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.search input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 12px; min-height: 46px; width: 100%; max-width: 100%; min-width: 0; display: block; }
.search input[type="date"] { -webkit-appearance: none; appearance: none; height: 46px; line-height: 1.2; }
.search input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
@media (max-width: 640px) { .search { grid-template-columns: minmax(0, 1fr); } }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 13.5px; min-height: 34px; max-width: 100%; }
.chipbtn:hover { border-color: var(--brand); }
.row2 .grow { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.gal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 24px; }
@media (max-width: 920px) { .gal { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 580px) { .gal { grid-template-columns: minmax(0, 1fr); } }
.card { border: 2px solid var(--ib); background: var(--ibg); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.red { --ib: var(--red-bd); --ibg: var(--red-bg); --ic: var(--red); } .card.yellow { --ib: var(--amber-bd); --ibg: var(--amber-bg); --ic: var(--amber); }
.card.green { --ib: var(--green-bd); --ibg: var(--green-bg); --ic: var(--green); } .card.grey { --ib: var(--grey-bd); --ibg: var(--grey-bg); --ic: var(--grey); }
.card.dropped { border-style: dashed; opacity: .78; }
.pic { position: relative; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.pic img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pic .ph { width: 38%; max-width: 120px; color: var(--ic); opacity: .55; } .pic .ph svg { width: 100%; height: auto; display: block; }
.pic .lvl { position: absolute; left: 10px; top: 10px; background: var(--ic); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 12.5px; font-weight: 700; max-width: calc(100% - 20px); }
:root[data-theme="dark"] .pic .lvl { color: #1B1429; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pic .lvl { color: #1B1429; } }
.cbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card h3 { margin: 0; font-size: 17.5px; line-height: 1.42; font-weight: 700; overflow-wrap: anywhere; }
.card h3 a { text-decoration: none; color: inherit; } .card h3 a:hover { text-decoration: underline; color: var(--brand); }
.cmeta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: auto; }
.cmeta b { color: var(--fg); font-weight: 600; }
.card p { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.upd2 { background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
.upd2 b { color: var(--brand); }
.rel { font-size: 12.5px; color: var(--muted); } .rel a, .read { color: var(--brand); font-weight: 600; }
.read { text-decoration: none; font-size: 14px; } .read:hover { text-decoration: underline; }
.more { display: block; margin: 26px auto 0; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 16px; border: 1.5px dashed var(--line); border-radius: 20px; }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.stat { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
.badge { background: var(--amber-bg); color: var(--amber); border-radius: 999px; padding: 1px 10px; font-weight: 600; font-size: 12px; }

/* ---------- เกี่ยวกับ ---------- */
.about { background: var(--surface-2); }
.about-grid { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: clamp(24px, 5vw, 60px); align-items: center; }
.about .face { aspect-ratio: 1; max-width: 380px; width: 100%; margin-inline: auto; border-radius: 50%; background: #CFC4F5; border: 3px solid var(--gold); overflow: hidden; display: grid; place-items: center; }
.about .face img { width: 100%; height: 100%; object-fit: cover; display: block; } .about .face svg { width: 82%; height: 82%; }
.about h2 { margin: 10px 0 12px; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; }
.about p { margin: 0 0 18px; color: var(--muted); font-size: 16px; max-width: 58ch; }
.feats { display: grid; gap: 12px; }
.feat { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.feat i { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; color: var(--gold); font-style: normal; font-family: var(--serif); font-weight: 700; }
.feat b { display: block; } .feat span { color: var(--muted); font-size: 14px; }
@media (max-width: 760px) { .about-grid { grid-template-columns: 1fr; } .about .face { max-width: 260px; } }

footer { background: var(--night); color: var(--night-muted); padding-block: 34px max(30px, env(safe-area-inset-bottom, 0px)); font-size: 13.5px; }
.fgrid { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
footer .bname { color: var(--night-fg); font-size: 18px; }
/* ---------- ล่าสุดแต่ละสาย / ไทม์ไลน์ / สถิติ ---------- */
.lgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .lgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lgrid { grid-template-columns: minmax(0, 1fr); } }
.lc { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--lcol, var(--brand)); border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; text-decoration: none; color: inherit; align-content: start; }
.lc:hover { box-shadow: 0 8px 22px rgba(60,30,110,.12); }
.lc .ln { font-weight: 700; font-size: 15px; } .lc .lt2 { font-size: 14px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lc small { color: var(--muted); font-size: 12.5px; }
.tl { display: grid; gap: 26px; }
.tlg h3 { margin: 0 0 12px; font-size: 20px; }
.tlist { position: relative; margin: 0; padding: 0 0 0 26px; list-style: none; display: grid; gap: 14px; }
.tlist::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tlist li { position: relative; }
.tlist li::before { content: ""; position: absolute; left: -26px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--gold); }
.tlist .td { font-size: 12.5px; color: var(--muted); } .tlist .tt { font-weight: 600; overflow-wrap: anywhere; }
.tlist .tt a { color: inherit; text-decoration: none; } .tlist .tt a:hover { text-decoration: underline; }
.tlist .tu { font-size: 13.5px; color: var(--amber); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .stats { grid-template-columns: minmax(0, 1fr); } }
.sbox { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.sbox h3 { margin: 0 0 12px; font-size: 17px; }
.bar { display: grid; grid-template-columns: minmax(70px, 120px) minmax(0, 1fr) 32px; gap: 10px; align-items: center; font-size: 13.5px; margin: 7px 0; }
.bar .tr { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; } .bar .tr i { display: block; height: 100%; background: var(--bc, var(--brand)); border-radius: 999px; }

.share:hover { border-color: var(--brand); }
.crow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }

  window.__noimg = function (el) { var box = el.parentNode; box.classList.add("noimg"); el.remove(); };

  try { var raw = localStorage.getItem(STORE); if (raw) { var o = JSON.parse(raw); if (o && Array.isArray(o.items) && o.items.length) { S.items = o.items; S.generated = o.generated_at || null; S.demo = false; } } } catch (e) {}
  function accept(text) {
    var o = JSON.parse(text), items = Array.isArray(o) ? o : o.items;
    if (!Array.isArray(items)) throw new Error("bad format");
    S.items = items; S.generated = (o && o.generated_at) || null; S.demo = false;
    try { localStorage.setItem(STORE, JSON.stringify({ generated_at: S.generated, items: items })); } catch (e) {}
    render();
  }

  function matched() {
    var q = S.q.trim().toLowerCase();
    return S.items.filter(function (it) {
      if (isDropped(it) && !S.dropped) return false;
      var d = ymd(when(it));
      if (S.from && (!d || d < S.from)) return false;
      if (S.to && (!d || d > S.to)) return false;
      if (S.line && (it.line || "") !== S.line) return false;
      if (S.src && (it.source_name || it.source) !== S.src) return false;
      if (q && ((it.title || "") + " " + (it.summary || "") + " " + (it.line || "") + " " + (it.station || "") + " " + (it.source_name || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function byNew(a, b) { return new Date(when(b)) - new Date(when(a)); }
  function liveItems() { return S.items.filter(function (it) { return !isDropped(it); }).sort(byNew); }
  function thumbImg(it) { var u = safeUrl(it.image); return u ? '<img class="photo" loading="lazy" referrerpolicy="no-referrer" alt="" src="' + esc(u) + '" onerror="__noimg(this)">' : ""; }

  function renderStatic() {
    var t = T(); document.documentElement.lang = S.lang;
    document.querySelectorAll("[data-i]").forEach(function (el) { var v = t[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-iph]").forEach(function (el) { el.placeholder = t[el.getAttribute("data-iph")]; });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === S.lang)); });
    $("sort").innerHTML = '<option value="desc"' + (S.sort === "desc" ? " selected" : "") + ">" + esc(t.newest) + '</option><option value="asc"' + (S.sort === "asc" ? " selected" : "") + ">" + esc(t.oldest) + "</option>";
    $("more").textContent = t.showMore;
  }

  function renderHero() {
    var t = T(), list = liveItems(), cand = list[0], h = $("hero");
    if (!cand) { h.innerHTML = '<div class="hero-grid"><div><h1>' + esc(t.noHero) + "</h1></div></div>"; $("next").innerHTML = ""; return; }
    var url = safeUrl(cand.url), L = lv(cand), img = safeUrl(cand.image);
    var photo = img ? '<img class="photo" referrerpolicy="no-referrer" alt="" src="' + esc(img) + '" onerror="__noimg(this)">' : "";
    var upd = cand.is_update && cand.delta ? '<div class="hupd"><b>' + esc(t.progress) + ":</b> " + esc(cand.delta) + "</div>" : "";
    var go = url ? '<a class="btn-gold" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.open) + "</a>" : "";
    h.innerHTML = '<div class="hero-grid"><div><div class="eyebrow">' + esc(t.latest) + " · " + esc(t.lvl[L]) + "</div><h1>" + esc(cand.title) + "</h1>" +
      '<div class="hcap"><span>' + esc(t.source) + ": <b>" + esc(cand.source_name || cand.source || "-") + "</b></span><span>" + esc(fDay(when(cand))) + " " + esc(fTime(when(cand))) + "</span></div>" + upd +
      '<div class="hbtns">' + go + '<a class="btn-ghost" href="#news">' + esc(t.seeAll) + "</a>" + (LINE_ADD_URL ? '<a class="btn-ghost" href="' + esc(LINE_ADD_URL) + '" target="_blank" rel="noopener noreferrer">' + esc(t.addFriend) + "</a>" : "") + "</div></div>" +
      '<div class="arch">' + photo + '<span class="mascot"><img src="logo.png" alt="" onerror="this.parentNode.innerHTML=\'' + MASCOT.replace(/'/g, "\\'") + '\'"></span>' +
      '<span class="tag">' + esc(t.source) + ": " + esc(cand.source_name || cand.source || "-") + " · " + esc(fDay(when(cand))) + "</span></div></div>";
    $("next").innerHTML = list.slice(1, 4).map(function (it) {
      var u = safeUrl(it.url); var tag = u ? "a" : "div";
      return "<" + tag + ' class="nx"' + (u ? ' href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"' : "") + '><span class="th">' + thumbImg(it) + "</span><span><b>" + esc(it.title) + "</b><small>" +
        esc(it.source_name || it.source || "") + " · " + esc(fDay(when(it))) + "</small></span></" + tag + ">";
    }).join("");
  }

  function renderCats() {
    var t = T(), live = liveItems();
    $("cats").innerHTML = MAIN.map(function (c) {
      var arr = live.filter(function (it) { return lv(it) === c; });
      return '<button type="button" class="cc ' + c + '" data-go="' + c + '"><span class="num">' + arr.length + '</span><span class="nm">' + esc(t.lvl[c]) + '</span><span class="ds">' + esc(t.desc[c]) +
        '</span><span class="lt">' + (arr[0] ? esc(arr[0].title) : esc(t.noNews)) + "</span></button>";
    }).join("");
  }

  function renderNews() {
    var t = T(), base = matched(), counts = { all: base.length, red: 0, yellow: 0, green: 0, grey: 0 };
    base.forEach(function (it) { var k = lv(it); if (counts[k] != null) counts[k]++; });
    $("tabs").innerHTML = CATS.map(function (c) {
      return '<button type="button" class="tab" data-c="' + c + '" aria-pressed="' + (S.cat === c) + '"><span class="dot d-' + c + '"></span>' + esc(t.cats[c]) + ' <span class="n">' + counts[c] + "</span></button>";
    }).join("");
    var srcs = {}; S.items.forEach(function (it) { var s = it.source_name || it.source; if (s) srcs[s] = 1; });
    $("src").innerHTML = '<option value="">' + esc(t.allSrc) + "</option>" + Object.keys(srcs).sort().map(function (s) { return '<option value="' + esc(s) + '"' + (s === S.src ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("");

    var lset = {}; S.items.forEach(function (it) { if (!isDropped(it) && it.line) lset[it.line] = 1; });
    $("lsel").innerHTML = '<option value="">' + esc(t.allLines) + "</option>" + Object.keys(lset).sort().map(function (l) { return '<option value="' + esc(l) + '"' + (l === S.line ? " selected" : "") + ">" + esc(l) + "</option>"; }).join("");
    var list = base.filter(function (it) { return S.cat === "all" || lv(it) === S.cat; });
    list.sort(function (a, b) { var d = byNew(a, b); return S.sort === "asc" ? -d : d; });
    $("count").textContent = t.found(list.length);
    var gal = $("gal");
    if (!list.length) { gal.innerHTML = '<div class="empty"><b>' + esc(t.empty1) + "</b>" + esc(t.empty2) + "</div>"; $("more").hidden = true; return; }
    gal.innerHTML = list.slice(0, S.shown).map(function (it) {
      var url = safeUrl(it.url), rel = related(it), L = lv(it);
      var title = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" : esc(it.title);
      var sum = it.summary && it.summary.trim() !== (it.title || "").trim() ? "<p>" + esc(it.summary) + "</p>" : "";
      var upd = it.is_update && it.delta ? '<div class="upd2"><b>' + esc(t.progress) + ":</b> " + esc(it.delta) + "</div>" : "";
      var tags = (it.line ? "<span>" + esc(it.line) + "</span>" : "") + (it.station ? "<span>" + esc(t.station) + esc(it.station) + "</span>" : "");
      var more = rel.length ? '<div class="rel">' + esc(t.more) + ": " + rel.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + (i + 1) + "</a>"; }).join(" · ") + "</div>" : "";
      var read = url ? '<a class="read" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.open) + " →</a>" : '<span class="rel"><i>' + esc(t.nolink) + "</i></span>";
      return '<article class="card ' + L + (isDropped(it) ? " dropped" : "") + '"><div class="pic">' + thumbImg(it) + '<span class="ph">' + RAIL + '</span><span class="lvl">' + esc(isDropped(it) ? t.dropTag : t.lvl[L]) + "</span></div>" +
        '<div class="cbody"><h3>' + title + "</h3>" + sum + upd + '<div class="cmeta"><b>' + esc(it.source_name || it.source || "") + "</b><span>" + esc(fDay(when(it))) + " " + esc(fTime(when(it))) + "</span>" + tags + "</div>" + more +
        '<div class="crow">' + read + (url ? '<button type="button" class="share" data-share="' + esc(String(it.id)) + '">' + esc(t.share) + "</button>" : "") + "</div></div></article>";
    }).join("");
    var m = $("more"); m.hidden = list.length <= S.shown;
  }

  var LCOL = { "น้ำเงิน": "#1E4FA8", "ม่วง": "#7B3FA0", "เหลือง": "#D9A400", "ชมพู": "#D6538A", "ส้ม": "#E8710A", "น้ำตาล": "#8A5A3C" };
  function lcol(name) { for (var k in LCOL) if ((name || "").indexOf(k) >= 0) return LCOL[k]; return "#5B3F94"; }

  function renderLines() {
    var t = T(), by = {}, live = liveItems();
    live.forEach(function (it) { if (it.line && !by[it.line]) by[it.line] = it; });
    var names = Object.keys(by).sort(function (a, b) { return byNew(by[a], by[b]); });
    $("lines").hidden = !names.length;
    $("lgrid").innerHTML = names.map(function (n) {
      var it = by[n], u = safeUrl(it.url), tag = u ? "a" : "div";
      return "<" + tag + ' class="lc" style="--lcol:' + lcol(n) + '"' + (u ? ' href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"' : "") + '><span class="ln">' + esc(n) + '</span><span class="lt2">' + esc(it.title) + "</span><small>" + esc(it.source_name || it.source || "") + " · " + esc(fDay(when(it))) + "</small></" + tag + ">";
    }).join("");
  }

  function renderTimeline() {
    var t = T(), by = {};
    liveItems().filter(function (it) { return lv(it) === "yellow"; }).forEach(function (it) { var k = it.line || t.noLine; (by[k] = by[k] || []).push(it); });
    var names = Object.keys(by).sort(function (a, b) { return byNew(by[a][0], by[b][0]); });
    $("tl").innerHTML = names.length ? names.map(function (n) {
      return '<div class="tlg"><h3>' + esc(n) + '</h3><ol class="tlist">' + by[n].slice(0, 6).map(function (it) {
        var u = safeUrl(it.url), ti = u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" : esc(it.title);
        return '<li><div class="td">' + esc(fDay(when(it))) + " · " + esc(it.source_name || it.source || "") + '</div><div class="tt">' + ti + "</div>" + (it.is_update && it.delta ? '<div class="tu">' + esc(t.progress) + ": " + esc(it.delta) + "</div>" : "") + "</li>";
      }).join("") + "</ol></div>";
    }).join("") : '<div class="empty"><b>' + esc(t.tlNone) + "</b></div>";
  }

  function bars(pairs, color) {
    var t = T(); if (!pairs.length) return "<p style=\"color:var(--muted)\">" + esc(t.stNone) + "</p>";
    var mx = Math.max.apply(null, pairs.map(function (p) { return p[1]; })) || 1;
    return pairs.map(function (p) { return '<div class="bar" style="--bc:' + (p[2] || color || "var(--brand)") + '"><span title="' + esc(p[0]) + '">' + esc(p[0]) + '</span><span class="tr"><i style="width:' + Math.max(4, Math.round(p[1] / mx * 100)) + '%"></i></span><b>' + p[1] + "</b></div>"; }).join("");
  }
  function top(map, n) { return Object.keys(map).map(function (k) { return [k, map[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, n); }

  function renderStats() {
    var t = T(), now = Date.now(), cut = now - 30 * 86400e3, rows = liveItems().filter(function (it) { return new Date(when(it)).getTime() >= cut; });
    var c = { red: 0, yellow: 0, green: 0, grey: 0 }, ln = {}, sr = {}, dayc = {};
    rows.forEach(function (it) { c[lv(it)]++; if (it.line) ln[it.line] = (ln[it.line] || 0) + 1; var s = it.source_name || it.source; if (s) sr[s] = (sr[s] || 0) + 1; var d = ymd(when(it)); dayc[d] = (dayc[d] || 0) + 1; });
    var col = { red: "var(--red)", yellow: "var(--amber)", green: "var(--green)", grey: "var(--grey)" };
    var days = [], mx = 1; for (var i = 13; i >= 0; i--) { var d = ymd(new Date(now - i * 86400e3).toISOString()); days.push([d, dayc[d] || 0]); mx = Math.max(mx, dayc[d] || 0); }
    $("statbox").innerHTML =
      '<div class="sbox"><h3>' + esc(t.stCat) + "</h3>" + bars(MAIN.map(function (k) { return [t.cats[k], c[k], col[k]]; })) + "</div>" +
      '<div class="sbox"><h3>' + esc(t.stDay) + '</h3><div class="days">' + days.map(function (p) { return '<div title="' + esc(p[0]) + ": " + p[1] + '" style="height:' + Math.round(p[1] / mx * 100) + '%"></div>'; }).join("") + '</div><div class="dayl"><span>' + esc(days[0][0].slice(5)) + "</span><span>" + esc(days[13][0].slice(5)) + "</span></div></div>" +
      '<div class="sbox"><h3>' + esc(t.stLine) + "</h3>" + bars(top(ln, 6).map(function (p) { return [p[0], p[1], lcol(p[0])]; })) + "</div>" +
      '<div class="sbox"><h3>' + esc(t.stSrc) + "</h3>" + bars(top(sr, 6)) + "</div>";
  }

  function renderLinks() {
    var t = T();
    $("flinks").innerHTML = '<a href="feed.xml" target="_blank" rel="noopener">' + esc(t.rss) + "</a>" + (LINE_ADD_URL ? '<a href="' + esc(LINE_ADD_URL) + '" target="_blank" rel="noopener noreferrer">' + esc(t.addFriend) + "</a>" : "");
  }

  function renderFoot() {
    var t = T();
    $("foot").innerHTML = S.demo ? '<span class="badge">' + esc(t.demo) + "</span> " + esc(t.demoMsg) : "";
    $("updated").textContent = S.demo ? "" : t.updated + " " + (S.generated ? fDay(S.generated) + " " + fTime(S.generated) : "-") + " · " + t.total + " " + S.items.length + " " + t.items;
  }

  function render() { renderStatic(); renderHero(); renderCats(); renderLines(); renderNews(); renderTimeline(); renderStats(); renderLinks(); renderFoot(); }
  function refilter() { S.shown = PAGE; renderNews(); }

  $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) { S.cat = b.getAttribute("data-c"); refilter(); } });
  $("cats").addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (!b) return; S.cat = b.getAttribute("data-go"); refilter(); $("news").scrollIntoView({ behavior: "smooth" }); });
  $("q").addEventListener("input", function (e) { S.q = e.target.value; refilter(); });
  $("from").addEventListener("change", function (e) { S.from = e.target.value; refilter(); });
  $("to").addEventListener("change", function (e) { S.to = e.target.value; refilter(); });
  $("lsel").addEventListener("change", function (e) { S.line = e.target.value; refilter(); });
  function toast(m) { var d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }
  $("gal").addEventListener("click", function (e) {
    var b = e.target.closest("[data-share]"); if (!b) return;
    var it = S.items.filter(function (x) { return String(x.id) === b.getAttribute("data-share"); })[0]; if (!it) return;
    var url = safeUrl(it.url);
    if (navigator.share) { navigator.share({ title: it.title, url: url }).catch(function () {}); return; }
    window.open("https://social-plugins.line.me/lineit/share?url=" + encodeURIComponent(url), "_blank", "noopener");
  });
  $("src").addEventListener("change", function (e) { S.src = e.target.value; refilter(); });
  $("sort").addEventListener("change", function (e) { S.sort = e.target.value; refilter(); });
  $("dropped").addEventListener("change", function (e) { S.dropped = e.target.checked; refilter(); });
  $("more").addEventListener("click", function () { S.shown += PAGE; renderNews(); });
  document.querySelector(".row2").addEventListener("click", function (e) {
    var b = e.target.closest("[data-range]"); if (!b) return;
    var n = +b.getAttribute("data-range");
    if (!n) { S.from = ""; S.to = ""; } else { S.to = ymd(new Date().toISOString()); S.from = ymd(new Date(Date.now() - (n - 1) * 86400e3).toISOString()); }
    $("from").value = S.from; $("to").value = S.to; refilter();
  });
  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]"); if (!b) return; S.lang = b.getAttribute("data-lang");
    try { localStorage.setItem(LSTORE, S.lang); } catch (er) {} render();
  });
  $("theme").addEventListener("click", function () {
    var root = document.documentElement, dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  function fetchNews() {
    fetch("news.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(accept).catch(function () {});
  }
  render(); fetchNews(); setInterval(fetchNews, 10 * 60 * 1000);
})();
</script>
</body>
</html>
