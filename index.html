<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>น้องเผือก รวมข่าวรถไฟฟ้าทั่วโลก</title>
<link rel="icon" href="logo.png">
<link rel="alternate" type="application/rss+xml" title="น้องเผือก" href="feed.xml">
<style>
/* ฟอนต์: ไทย = Prompt (SIL OFL) · อังกฤษ = Arial (ติดเครื่องผู้ใช้) สำรอง Arimo (SIL OFL, ขนาดเท่า Arial) */
@font-face{font-family:Prompt;font-weight:400;font-display:swap;src:url(fonts/prompt-thai-400-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:500;font-display:swap;src:url(fonts/prompt-thai-500-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:600;font-display:swap;src:url(fonts/prompt-thai-600-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:700;font-display:swap;src:url(fonts/prompt-thai-700-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200B-200D,U+25CC}
@font-face{font-family:Arimo;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/arimo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Arimo;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/arimo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Arimo;font-weight:700;font-style:italic;font-display:swap;src:url(fonts/arimo-latin-700-italic.woff2) format("woff2")}
:root{--bg:#FDF7EC;--paper:#FFFFFF;--soft:#F6EEDC;--fg:#12203F;--muted:#51607C;--line:#EBE0C8;
--navy:#1B44C4;--navy-fg:#FFFFFF;--gold:#A97812;--goldbg:#F9EBC8;--deep:#0F2257;
--inv:#6D3FD2;--invbg:#F0EAFE;--invbd:#CDBBF6;
--red:#C62828;--redbg:#FDEEEE;--redbd:#EDB0B0;--amb:#946200;--ambbg:#FFF4D4;--ambbd:#E6C25C;--grn:#26773B;--grnbg:#E8F5EA;--grnbd:#9BCFA5;--gry:#5B6470;--grybg:#EEF0F3;--grybd:#C3C9D1;
--sk1:#E3EFFD;--sk2:#FFFFFF;--bl1:#CADCF3;--bl2:#A8C3E8;--trk:#2C4B88;--sans:Arial,Arimo,Prompt,"Noto Sans Thai",Loma,sans-serif}
:root[data-theme=dark]{--bg:#050912;--paper:#0C1424;--soft:#111C33;--fg:#EAF0FB;--muted:#9BABC8;--line:#1D2C49;
--navy:#8DB4FF;--navy-fg:#050912;--gold:#E8BE55;--goldbg:#2B2613;--deep:#08122A;
--inv:#B79BFF;--invbg:#1D1636;--invbd:#4B3A86;
--red:#FF8E86;--redbg:#341C22;--redbd:#7D3A42;--amb:#F4C25A;--ambbg:#32280F;--ambbd:#85681F;--grn:#7FCB8C;--grnbg:#15291C;--grnbd:#3B7046;--gry:#AEB6C2;--grybg:#1E242E;--grybd:#4A5361;
--sk1:#071126;--sk2:#12285A;--bl1:#10204A;--bl2:#183264;--trk:#030610}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.65 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.it{font-weight:700;color:var(--gold)} html[lang=en] .it{font-style:italic}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;gap:22px;min-height:74px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:#CFC4F5;flex:none}
.brand b{display:block;font-size:1.25rem;color:var(--navy);line-height:1.15;font-weight:700}.brand small{color:var(--muted);font-size:.8rem;display:block;line-height:1.3}
.nl{display:flex;gap:22px;margin-left:18px;font-size:.92rem;font-weight:600}.nl a{padding:6px 0;border-bottom:2px solid transparent}.nl a:hover{border-color:var(--gold)}
.tl2{margin-left:auto;display:flex;gap:8px;align-items:center}
.ico{min-width:38px;height:38px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;background:var(--paper);cursor:pointer;font-weight:700;font-size:.82rem;padding:0 8px}
.ico:hover{border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:transparent;padding:0 13px;height:36px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted)}.seg button[aria-pressed=true]{background:var(--navy);color:var(--navy-fg)}
.burger{display:none}
@media(max-width:980px){.nl{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;gap:0;margin:0;padding:6px 22px 14px}.nl.open{display:flex}.nl a{padding:12px 0;border-bottom:1px solid var(--line)}.burger{display:grid}.top{position:sticky}}
@media(max-width:520px){.brand small{display:none}.brand img{width:44px;height:44px}.ico.aa{display:none}.nav{gap:10px}}

.c-i{--c:var(--inv);--cg:var(--invbg)}
.tab[data-c=innov]{--tb:var(--invbd);--tg:var(--invbg)}
.btn.org2{min-height:38px;padding:0 16px;font-size:.84rem;background:#06C755;color:#fff}@media(max-width:760px){.btn.org2{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--bg);min-height:clamp(430px,36vw,560px);display:flex;align-items:center}
.hero-img{position:absolute;top:0;right:0;bottom:0;width:58%}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;display:block}
.hero-img:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 0,color-mix(in srgb,var(--bg) 55%,transparent) 22%,transparent 46%)}
html[data-theme=dark] .hero-img img{filter:brightness(.78) saturate(.95)}
.hero .wrap{position:relative;z-index:2;padding-top:44px;padding-bottom:96px}
.ht{max-width:min(600px,50%)}
.eb{display:flex;align-items:center;gap:14px;color:var(--gold);font-weight:700;font-size:.9rem;margin:0 0 14px}.eb:before{content:"";width:40px;height:2px;background:var(--gold);flex:none}
.ht h1 span,.ht h1 b{white-space:nowrap}
.ht h1{margin:0;font-size:clamp(2rem,7.6vw,3.9rem);line-height:1.18;color:var(--navy);font-weight:700;letter-spacing:-.01em}
.ht h1 b{display:block;color:var(--fg);font-weight:700}
.ht p{margin:16px 0 24px;font-size:1.04rem;color:var(--muted);max-width:44ch}
.hb{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cd{display:flex;gap:8px}.cd i{width:13px;height:13px;border-radius:50%;display:block}
.cd i:nth-child(1){background:#D32F2F}.cd i:nth-child(2){background:#F9A825}.cd i:nth-child(3){background:#2E7D32}.cd i:nth-child(4){background:#6D3FD2}.cd i:nth-child(5){border:2px solid var(--muted)}
.fs{position:relative;z-index:5;margin:-58px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 44px rgba(14,42,96,.14);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:hidden}
.fs a{display:flex;align-items:center;gap:12px;padding:18px 20px;border-left:1px solid var(--line)}
.fs a:first-child{border-left:0}.fs a:hover{background:var(--goldbg)}
.fs i{font-style:normal;font-size:1.6rem;flex:none}.fs b{display:block;font-size:.95rem;line-height:1.3}.fs small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
@media(max-width:980px){.fs{grid-template-columns:repeat(2,minmax(0,1fr))}.fs a{border-top:1px solid var(--line);border-left:0}.fs a:nth-child(-n+2){border-top:0}.fs a:nth-child(even){border-left:1px solid var(--line)}.fs a:last-child{grid-column:1/-1;border-left:0}}
@media(max-width:760px){.hero{display:block;min-height:0;padding-bottom:84px}.hero-img{position:relative;width:100%;height:230px}.hero-img:before{background:linear-gradient(0deg,var(--bg) 0,transparent 60%)}.hero .wrap{padding-top:6px;padding-bottom:0}.ht{max-width:100%}}
.dh{padding-top:34px}
/* กรอบ เรียนรู้จากทุกเส้นทางทั่วโลก */
.world{position:relative;overflow:hidden;margin-top:30px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(100deg,var(--goldbg),var(--paper) 55%,var(--soft));padding:38px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center}
.world h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.3;color:var(--navy);font-weight:700}
.world p{margin:8px 0 18px;color:var(--gold);font-weight:700;font-size:1.02rem;max-width:44ch}
.rt{position:relative;height:120px}
.rt:before{content:"";position:absolute;left:0;right:0;top:56px;height:6px;border-radius:4px;background:var(--gold)}
.rt span{position:absolute;top:46px;width:26px;height:26px;border-radius:50%;background:var(--paper);border:5px solid var(--gold)}
.rt span:nth-child(odd){border-color:var(--navy)}.rt span.x{width:34px;height:34px;top:42px;margin-left:-4px;background:var(--navy);border-color:var(--gold)}
.rt em{position:absolute;top:84px;font-style:normal;font-size:.78rem;color:var(--muted);transform:translateX(-30%);white-space:nowrap}
@media(max-width:820px){.world{grid-template-columns:1fr;padding:26px 22px}.rt{height:96px}.rt em{display:none}}
/* hero carousel */
.hrow{padding:12px 0 8px}
.car{position:relative;border-radius:22px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 50px rgba(20,40,90,.12)}
.track{display:flex;transition:transform .7s cubic-bezier(.65,.05,.3,1);will-change:transform}
.slide{position:relative;min-width:100%;min-height:clamp(380px,34vw,470px);display:flex;align-items:center;overflow:hidden}
.hbg{position:absolute;inset:0;background:var(--deep)}.hbg svg,.hbg img{position:absolute;inset:0;width:100%;height:100%;display:block}.hbg img{object-fit:cover}
.slide:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--paper) 0%,color-mix(in srgb,var(--paper) 92%,transparent) 38%,transparent 68%)}
.cp{position:relative;z-index:2;padding:34px 38px 66px;max-width:54%;display:flex;flex-direction:column;gap:11px;align-items:flex-start}
.chip{color:#fff;font-weight:700;font-size:.8rem;border-radius:999px;padding:3px 14px;background:var(--cc)}
html[data-theme=dark] .chip{color:#0A1220}
.cp .k{font-size:.82rem;color:var(--muted)}.cp h2{margin:0;font-size:clamp(1.35rem,2.5vw,2rem);line-height:1.35;font-weight:700;overflow-wrap:anywhere}
.cp .m{font-size:.88rem;color:var(--muted)}.upd{border-left:4px solid var(--gold);background:var(--goldbg);padding:7px 12px;border-radius:8px;font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:var(--navy-fg);padding:11px 24px;border-radius:999px;font-weight:700;border:0;cursor:pointer;min-height:46px;font-size:.95rem}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.ctl{position:absolute;z-index:3;left:38px;right:18px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.dots{display:flex;gap:8px;pointer-events:auto}.dots button{width:34px;height:20px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}
.dots button:before{content:"";position:absolute;left:0;right:0;top:7px;height:5px;border-radius:9px;background:rgba(19,33,63,.22)}
html[data-theme=dark] .dots button:before{background:rgba(255,255,255,.28)}
.dots button:after{content:"";position:absolute;left:0;top:7px;height:5px;border-radius:9px;background:var(--gold);width:0}
.dots button.on:after{width:100%}.dots button.on.run:after{animation:fill 5s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.arrs{display:flex;gap:8px;pointer-events:auto}.arrs button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#16357A;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:1.1rem}
.cnt{position:absolute;right:20px;top:16px;z-index:3;background:rgba(15,25,50,.7);color:#fff;border-radius:999px;padding:2px 12px;font-size:.78rem}
@media(max-width:760px){
 .slide{flex-direction:column;align-items:stretch;min-height:0}.slide:before{display:none}
 .hbg{position:relative;height:210px;flex:none}.cp{max-width:100%;padding:18px 18px 62px;background:var(--paper)}
 .ctl{left:18px}.cnt{top:12px}}
/* sections */
.sec{padding:44px 0 6px}.hd{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:0 0 16px;flex-wrap:wrap}
.hd h2{margin:0;font-size:clamp(1.5rem,3.2vw,2rem);color:var(--navy);line-height:1.3;font-weight:700}.hd p{margin:2px 0 0;color:var(--muted);font-size:.92rem}.hd a{color:var(--muted);font-size:.88rem}
.kt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;padding-top:26px}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(20,40,90,.07);overflow:hidden;display:flex;flex-direction:column}
.fig h3{margin:0;padding:14px 18px;font-size:.9rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.fr{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 18px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%;flex:1}
.fr:last-child{border:0}.fr:hover{background:var(--soft)}
.fr .d{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--cg);color:var(--c);font-weight:700}
.fr b{font-size:.92rem;display:block;line-height:1.35}.fr small{color:var(--muted);font-size:.76rem;display:block;line-height:1.35}.fr .n{font-size:1.6rem;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.c-r{--c:var(--red);--cg:var(--redbg)}.c-y{--c:var(--amb);--cg:var(--ambbg)}.c-g{--c:var(--grn);--cg:var(--grnbg)}.c-k{--c:var(--gry);--cg:var(--grybg)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tc{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:3px 14px;align-content:start}
.tc:hover{border-color:var(--gold);transform:translateY(-1px)}
.tc.line{background:var(--goldbg);border-color:var(--gold)}
.tc .ic{grid-row:span 3;width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:1.25rem}
.tc b{font-size:1rem;line-height:1.4}.tc span.s{color:var(--muted);font-size:.82rem;line-height:1.5}.tc u{text-decoration:none;color:var(--navy);font-weight:700;font-size:.86rem;margin-top:3px}
@media(max-width:980px){.kt{grid-template-columns:1fr}}@media(max-width:560px){.tools{grid-template-columns:1fr}}
.lgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.lgrid{grid-template-columns:1fr}}
.lc{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--lc,var(--navy));border-radius:14px;padding:13px 16px;display:grid;gap:3px;align-content:start}
.lc:hover{box-shadow:0 8px 22px rgba(20,40,90,.12)}.lc .ln{font-weight:700}.lc .lt{font-size:.9rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.lc small{color:var(--muted);font-size:.78rem}
/* finder */
.bar{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{border:1.5px solid var(--tb);background:var(--tg);border-radius:999px;padding:4px 14px;font-size:.88rem;cursor:pointer;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.tab .n{font-weight:700;font-variant-numeric:tabular-nums}
.tab[data-c=all]{--tb:var(--line);--tg:var(--soft)}.tab[data-c=red]{--tb:var(--redbd);--tg:var(--redbg)}.tab[data-c=yellow]{--tb:var(--ambbd);--tg:var(--ambbg)}.tab[data-c=green]{--tb:var(--grnbd);--tg:var(--grnbg)}.tab[data-c=grey]{--tb:var(--grybd);--tg:var(--grybg)}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
.srch{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.srch label{display:grid;gap:3px;font-size:.76rem;color:var(--muted);min-width:0}
.srch input,.sel{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:8px 12px;min-height:46px;width:100%;min-width:0;max-width:100%;display:block}
.srch input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:1.2}
.srch input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
@media(max-width:640px){.srch{grid-template-columns:minmax(0,1fr)}}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:.84rem;min-height:36px;max-width:100%}.chipbtn:hover{border-color:var(--gold)}
select.chipbtn{background:var(--paper)}
.grow{margin-left:auto;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:18px}
@media(max-width:1020px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}@media(max-width:460px){.gal{grid-template-columns:minmax(0,1fr)}}
.n{display:flex;flex-direction:column;gap:8px;min-width:0}
.n .p{aspect-ratio:4/3;border-radius:14px;overflow:hidden;position:relative;border-bottom:4px solid var(--c);background:var(--soft)}
.n .p svg,.n .p img{position:absolute;inset:0;width:100%;height:100%;display:block}.n .p img{object-fit:cover}
.n .p em{position:absolute;left:10px;top:10px;font-style:normal;background:var(--c);color:#fff;border-radius:999px;padding:1px 11px;font-size:.74rem;font-weight:700;max-width:calc(100% - 20px);z-index:2}
html[data-theme=dark] .n .p em{color:#0A1220}
.n h3{margin:0;font-size:.98rem;line-height:1.5;font-weight:600;overflow-wrap:anywhere}.n h3 a:hover{text-decoration:underline}
.n small{color:var(--muted);font-size:.78rem;display:block}.n .u2{background:var(--goldbg);border-radius:8px;padding:5px 9px;font-size:.8rem}
.n .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}.n .row a{color:var(--navy);font-weight:700;font-size:.84rem}
.n .sh{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 12px;font-size:.78rem;cursor:pointer;min-height:32px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:18px}.empty b{display:block;color:var(--fg);font-size:1.1rem;margin-bottom:4px}
.more{display:block;margin:24px auto 0}
.demo{text-align:center;margin-top:16px;color:var(--muted);font-size:.82rem}.demo span{background:var(--ambbg);color:var(--amb);border-radius:999px;padding:1px 10px;font-weight:700}
/* trust + insights */

        '<div class="row">' + read + (u ? '<button type="button" class="sh" data-share="' + esc(String(it.id)) + '">' + esc(t.share) + "</button>" : "") + "</div></article>";
    }).join("");
    $("more").hidden = list.length <= S.shown;
  }

  /* ---------- ไทม์ไลน์ + สถิติ ---------- */
  function bars(pairs) {
    var t = T(); if (!pairs.length) return '<p style="color:var(--muted);margin:0">' + esc(t.stNone) + "</p>";
    var mx = Math.max.apply(null, pairs.map(function (p) { return p[1]; })) || 1;
    return pairs.map(function (p) { return '<div class="br" style="--bc:' + (p[2] || "var(--navy)") + '"><span title="' + esc(p[0]) + '">' + esc(p[0]) + '</span><span class="t"><i style="width:' + Math.max(4, Math.round(p[1] / mx * 100)) + '%"></i></span><b>' + p[1] + "</b></div>"; }).join("");
  }
  function top(map, n) { return Object.keys(map).map(function (k) { return [k, map[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, n); }
  function renderInsights() {
    var t = T(), now = Date.now(), cut = now - 30 * 86400e3, rows = S.items.filter(function (it) { return new Date(when(it)).getTime() >= cut; });
    var yl = liveItems().filter(function (it) { return lv(it) === "yellow"; }), by = {};
    yl.forEach(function (it) { var k = it.line || t.noLine; (by[k] = by[k] || []).push(it); });
    var names = Object.keys(by).sort(function (a, b) { return byNew(by[a][0], by[b][0]); });
    if (!by[S.tl]) S.tl = names[0] || "";
    var tl = names.length ? '<ul class="tlx">' + by[S.tl].slice(0, 6).map(function (it) {
      var u = safeUrl(it.url), ti = u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" : esc(it.title);
      return "<li>" + ti + "<small>" + esc(fDay(when(it))) + " · " + esc(it.source_name || it.source || "") + "</small>" + (it.is_update && it.delta ? '<span class="tu">' + esc(t.progress) + ": " + esc(it.delta) + "</span>" : "") + "</li>";
    }).join("") + "</ul>" : '<p style="color:var(--muted);margin:0">' + esc(t.tlNone) + "</p>";
    var sel = names.length > 1 ? '<select id="tlsel" aria-label="line">' + names.map(function (n) { return '<option value="' + esc(n) + '"' + (n === S.tl ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + "</select>" : (names[0] ? '<small style="font-weight:400;color:var(--muted)">' + esc(names[0]) + "</small>" : "");
    var c = { red: 0, yellow: 0, green: 0, innov: 0, grey: 0 }, ln = {}, sr = {}, dc = {};
    rows.forEach(function (it) { c[lv(it)]++; if (it.line) ln[it.line] = (ln[it.line] || 0) + 1; var s = it.source_name || it.source; if (s) sr[s] = (sr[s] || 0) + 1; var d = ymd(when(it)); dc[d] = (dc[d] || 0) + 1; });
    var col = { red: "var(--red)", yellow: "var(--amb)", green: "var(--grn)", innov: "var(--inv)", grey: "var(--gry)" };
    var days = [], mx = 1; for (var i = 13; i >= 0; i--) { var d = ymd(new Date(now - i * 86400e3).toISOString()); days.push([d, dc[d] || 0]); mx = Math.max(mx, dc[d] || 0); }
    $("ins").innerHTML =
      '<div class="box"><h3>' + esc(t.tlT) + sel + "</h3>" + tl + "</div>" +
      '<div class="box"><h3>' + esc(t.stCat) + "</h3>" + bars(MAIN.map(function (k) { return [t.lvl[k], c[k], col[k]]; })) + "</div>" +
      '<div class="box"><h3>' + esc(t.stLine) + "</h3>" + bars(top(ln, 6).map(function (p) { return [p[0], p[1], lcol(p[0])]; })) + "<h3 style=\"margin-top:16px\">" + esc(t.stSrc) + "</h3>" + bars(top(sr, 5)) + "</div>" +
      '<div class="box"><h3>' + esc(t.stDay) + '</h3><div class="days">' + days.map(function (p) { return '<div title="' + esc(p[0]) + ": " + p[1] + '" style="height:' + Math.round(p[1] / mx * 100) + '%"></div>'; }).join("") + '</div><div class="dayl"><span>' + esc(days[0][0].slice(5)) + "</span><span>" + esc(days[13][0].slice(5)) + "</span></div></div>";
    var ts = $("tlsel"); if (ts) ts.addEventListener("change", function (e) { S.tl = e.target.value; renderInsights(); });
    var sc = {}; S.items.forEach(function (it) { var s = it.source_name || it.source; if (s) sc[s] = (sc[s] || 0) + 1; });
    $("srcs").innerHTML = top(sc, 5).map(function (p) { return "<div>" + esc(p[0]) + "</div>"; }).join("");
  }

  function renderFoot() {
    var t = T();
    $("demo").innerHTML = S.demo ? "<span>" + esc(t.demo) + "</span> " + esc(t.demoMsg) : "";
    $("updated").textContent = S.demo ? "" : t.updated + " " + (S.generated ? fDay(S.generated) + " " + fTime(S.generated) : "-") + " · " + t.total + " " + S.items.length + " " + t.items;
  }
  function render() { renderStatic(); renderHero(); renderOverview(); renderLines(); renderNews(); renderInsights(); renderFoot(); }
  function refilter() { S.shown = PAGE; renderNews(); }

  /* ---------- events ---------- */
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) { S.cat = b.getAttribute("data-c"); refilter(); } });
  $("figs").addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (!b) return; S.cat = b.getAttribute("data-go"); refilter(); $("news").scrollIntoView({ behavior: "smooth" }); });
  $("q").addEventListener("input", function (e) { S.q = e.target.value; refilter(); });
  $("from").addEventListener("change", function (e) { S.from = e.target.value; refilter(); });
  $("to").addEventListener("change", function (e) { S.to = e.target.value; refilter(); });
  $("src").addEventListener("change", function (e) { S.src = e.target.value; refilter(); });
  $("lsel").addEventListener("change", function (e) { S.line = e.target.value; refilter(); });
  $("sort").addEventListener("change", function (e) { S.sort = e.target.value; refilter(); });
  $("more").addEventListener("click", function () { S.shown += PAGE; renderNews(); });
  document.querySelector(".row2").addEventListener("click", function (e) {
    var b = e.target.closest("[data-range]"); if (!b) return; var n = +b.getAttribute("data-range");
    if (!n) { S.from = ""; S.to = ""; } else { S.to = ymd(new Date().toISOString()); S.from = ymd(new Date(Date.now() - (n - 1) * 86400e3).toISOString()); }
    $("from").value = S.from; $("to").value = S.to; refilter();
  });
  function toast(m) { var d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }
  $("gal").addEventListener("click", function (e) {
    var b = e.target.closest("[data-share]"); if (!b) return;
    var it = S.items.filter(function (x) { return String(x.id) === b.getAttribute("data-share"); })[0]; if (!it) return; var u = safeUrl(it.url);
    if (navigator.share) { navigator.share({ title: it.title, url: u }).catch(function () {}); return; }
    window.open("https://social-plugins.line.me/lineit/share?url=" + encodeURIComponent(u), "_blank", "noopener");
  });
  document.querySelector(".seg").addEventListener("click", function (e) { var b = e.target.closest("[data-lang]"); if (!b) return; S.lang = b.getAttribute("data-lang"); lsSet(LSTORE, S.lang); render(); });
  $("theme").addEventListener("click", function () { var r = document.documentElement, dark = r.getAttribute("data-theme") === "dark"; r.setAttribute("data-theme", dark ? "light" : "dark"); lsSet(TSTORE, dark ? "light" : "dark"); });
  $("aa").addEventListener("click", function () { aa = (aa + 1) % SIZES.length; document.documentElement.style.fontSize = SIZES[aa] + "px"; lsSet(ASTORE, String(aa)); });
  $("burger").addEventListener("click", function () { var o = $("nl").classList.toggle("open"); $("burger").setAttribute("aria-expanded", String(o)); });
  $("nl").addEventListener("click", function (e) { if (e.target.closest("a")) { $("nl").classList.remove("open"); $("burger").setAttribute("aria-expanded", "false"); } });
  $("logo").addEventListener("error", function () { this.style.visibility = "hidden"; });

  /* ---------- โหลดข่าว ---------- */
  var raw = lsGet(STORE);
  if (raw) { try { var o = JSON.parse(raw); if (o && Array.isArray(o.items) && o.items.length) { S.items = o.items; S.generated = o.generated_at || null; S.demo = false; } } catch (e) {} }
  var lastSig = "";
  function accept(text) {
    var o = JSON.parse(text), items = Array.isArray(o) ? o : o.items;
    if (!Array.isArray(items)) throw new Error("bad format");
    var sig = (o && o.generated_at) + ":" + items.length;
    S.items = items; S.generated = (o && o.generated_at) || null; S.demo = false;
    lsSet(STORE, JSON.stringify({ generated_at: S.generated, items: items }));
    if (sig !== lastSig) { lastSig = sig; render(); } else renderFoot();
  }
  function fetchNews() { fetch("news.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(accept).catch(function () {}); }
  render(); fetchNews(); setInterval(fetchNews, 10 * 60 * 1000);
})();
</script>
</body>
</html>
