<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>น้องเผือก ข่าวรถไฟฟ้า</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@600;700&display=swap">
<style>
/* Layout: หัวเว็บ(โลโก้ใหญ่+สลับภาษา) → Hero ข่าวล่าสุด → กล่องแนะนำน้องเผือก → กรอบข่าวหลัก (ค้นหา+รายการ)
   Color: ม่วงเผือกเป็นสีแบรนด์ · แดง/เหลือง/เขียว/เทา เป็นสีของหมวดข่าว (ตรงกับในไลน์) ทุกหมวดมีสีพื้นอ่อน+ขอบเข้มของตัวเอง */
:root {
  --bg: #F3F1F8; --surface: #FFFFFF; --surface-2: #F0ECF7; --fg: #231F2E; --muted: #6A6479; --line: #DDD7E8;
  --brand: #5B3F94; --brand-fg: #FFFFFF; --brand-soft: #E7DFF5;
  --red: #C62828; --red-bg: #FDECEC; --red-bd: #EFA6A6;
  --amber: #A86200; --amber-bg: #FFF3D6; --amber-bd: #EBC15F;
  --green: #2E7D32; --green-bg: #E6F4E7; --green-bd: #96CC99;
  --grey: #5F6368; --grey-bg: #EEF0F2; --grey-bd: #BDC2C8;
  --font-display: "Prompt", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141F; --surface: #211D2C; --surface-2: #2A2538; --fg: #EEEAF6; --muted: #A59EB8; --line: #3A3450;
    --brand: #B9A2F0; --brand-fg: #1B1429; --brand-soft: #34294F;
    --red: #FF8A80; --red-bg: #3A1F23; --red-bd: #8A3B42;
    --amber: #FFC259; --amber-bg: #392C12; --amber-bd: #8A6A22;
    --green: #81C784; --green-bg: #1C3120; --green-bd: #3F7444;
    --grey: #B0B4BA; --grey-bg: #2A2C30; --grey-bd: #5A5E66; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141F; --surface: #211D2C; --surface-2: #2A2538; --fg: #EEEAF6; --muted: #A59EB8; --line: #3A3450;
  --brand: #B9A2F0; --brand-fg: #1B1429; --brand-soft: #34294F;
  --red: #FF8A80; --red-bg: #3A1F23; --red-bd: #8A3B42;
  --amber: #FFC259; --amber-bg: #392C12; --amber-bd: #8A6A22;
  --green: #81C784; --green-bg: #1C3120; --green-bd: #3F7444;
  --grey: #B0B4BA; --grey-bg: #2A2C30; --grey-bd: #5A5E66; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.shell { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }

/* ---------- หัวเว็บ ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 72px; height: 72px; flex: none; border-radius: 20px; background: var(--brand-soft); display: grid; place-items: center; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo svg { width: 80%; height: 80%; }
.name { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 6vw, 32px); line-height: 1.15; }
.sub { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; min-height: 38px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 38px; font-size: 14px; }
.btn:hover { border-color: var(--brand); }

/* ---------- Hero: ข่าวล่าสุด ---------- */
.hero { border-radius: 20px; overflow: hidden; border: 2px solid var(--hero-bd, var(--line)); background: var(--hero-bg, var(--surface)); display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); min-height: 260px; }
.hero.red { --hero-bd: var(--red-bd); --hero-bg: var(--red-bg); --hero-c: var(--red); }
.hero.yellow { --hero-bd: var(--amber-bd); --hero-bg: var(--amber-bg); --hero-c: var(--amber); }
.hero.green { --hero-bd: var(--green-bd); --hero-bg: var(--green-bg); --hero-c: var(--green); }
.hero.grey { --hero-bd: var(--grey-bd); --hero-bg: var(--grey-bg); --hero-c: var(--grey); }
.hero-pic { position: relative; background: var(--hero-c, var(--brand)); min-height: 200px; display: flex; flex-direction: column; color: #fff; overflow: hidden; }
.hero-pic img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-pic .art { width: 52%; max-width: 170px; opacity: .92; margin: auto; padding: 18px 0 8px; }
.hero-pic .art svg { width: 100%; height: auto; display: block; }
.hero-pic .cap { position: relative; margin-top: auto; padding: 10px 14px; font-size: 12.5px; background: rgba(0,0,0,.45); color: #fff; }
.hero-pic img.photo + .cap { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
.hero-body { padding: 22px; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-width: 0; }
.kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.pill { border-radius: 999px; padding: 2px 12px; background: var(--hero-c, var(--brand)); color: #fff; }
:root[data-theme="dark"] .pill, :root:not([data-theme="light"]) .pill { color: #1B1429; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .pill { color: #fff; } }
:root[data-theme="light"] .pill { color: #fff; }
.hero h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 4.4vw, 28px); line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance; }
.hero .cap2 { color: var(--muted); font-size: 14px; }
.hero .go { align-self: flex-start; text-decoration: none; font-weight: 600; color: var(--brand-fg); background: var(--brand); border-radius: 10px; padding: 8px 16px; min-height: 40px; display: inline-flex; align-items: center; }
.hero .upd { background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13.5px; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .hero-pic { min-height: 170px; } .hero-pic .art { max-width: 110px; padding-top: 14px; } .hero-body { padding: 16px; } }

/* ---------- กล่องแนะนำ ---------- */
.about { background: var(--brand-soft); border-radius: 16px; padding: 16px 18px; display: grid; gap: 8px; }
.about h3 { margin: 0; font-family: var(--font-display); font-size: 17px; color: var(--brand); }
.about p { margin: 0; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.facts span { background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 13px; }

/* ---------- กรอบข่าวหลัก ---------- */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; height: min(80vh, 820px); min-height: 520px; }
.bar { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tab { border: 2px solid var(--tb, var(--line)); background: var(--tbg, transparent); color: var(--fg); border-radius: 12px; padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; font-weight: 500; }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 700; }
.tab[data-c="all"] { --tb: var(--brand); --tbg: var(--brand-soft); }
.tab[data-c="red"] { --tb: var(--red-bd); --tbg: var(--red-bg); }
.tab[data-c="yellow"] { --tb: var(--amber-bd); --tbg: var(--amber-bg); }
.tab[data-c="green"] { --tb: var(--green-bd); --tbg: var(--green-bg); }
.tab[data-c="grey"] { --tb: var(--grey-bd); --tbg: var(--grey-bg); }
.tab[aria-pressed="true"][data-c="all"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.tab[aria-pressed="true"][data-c="red"] { background: var(--red); border-color: var(--red); }
.tab[aria-pressed="true"][data-c="yellow"] { background: var(--amber); border-color: var(--amber); }
.tab[aria-pressed="true"][data-c="green"] { background: var(--green); border-color: var(--green); }
.tab[aria-pressed="true"][data-c="grey"] { background: var(--grey); border-color: var(--grey); }
.tab[aria-pressed="true"]:not([data-c="all"]) { color: #fff; }
:root[data-theme="dark"] .tab[aria-pressed="true"], :root:not([data-theme="light"]) .tab[aria-pressed="true"] { color: #1B1429 !important; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .tab[aria-pressed="true"] { color: #fff !important; } }
:root[data-theme="light"] .tab[aria-pressed="true"] { color: #fff !important; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.d-red { background: var(--red); } .d-yellow { background: var(--amber); } .d-green { background: var(--green); } .d-grey { background: var(--grey); } .d-all { background: var(--brand); }
.tab[aria-pressed="true"] .dot { background: currentColor; }

.search { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.search label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.search input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 7px 10px; min-height: 42px; width: 100%; max-width: 100%; min-width: 0; display: block; }
.search input[type="date"] { -webkit-appearance: none; appearance: none; height: 42px; line-height: 1.2; }
.search input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
@media (max-width: 640px) { .search { grid-template-columns: minmax(0, 1fr); } }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chipbtn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; min-height: 32px; max-width: 100%; }
.chipbtn:hover { border-color: var(--brand); }
.row2 .grow { margin-left: auto; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.feed { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 12px; display: block; }
.day { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 10px 2px 6px; z-index: 1; }
.item { border: 2px solid var(--ib); background: var(--ibg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 4px; }
.item.red { --ib: var(--red-bd); --ibg: var(--red-bg); --ic: var(--red); }
.item.yellow { --ib: var(--amber-bd); --ibg: var(--amber-bg); --ic: var(--amber); }
.item.green { --ib: var(--green-bd); --ibg: var(--green-bg); --ic: var(--green); }
.item.grey { --ib: var(--grey-bd); --ibg: var(--grey-bg); --ic: var(--grey); }
.lvl { font-size: 12.5px; font-weight: 700; color: var(--ic); display: flex; align-items: center; gap: 6px; }
.item h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.item h3 a { text-decoration: none; }
.item h3 a:hover { text-decoration: underline; color: var(--brand); }
.item .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.item p { margin: 2px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.upd2 { margin-top: 4px; background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13.5px; }
.upd2 b { color: var(--brand); }
.rel { font-size: 12.5px; color: var(--muted); }
.rel a, .item .open { color: var(--brand); font-weight: 600; }
.item.dropped { opacity: .72; border-style: dashed; }
.empty { padding: 40px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.foot { font-size: 12.5px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { background: var(--amber-bg); color: var(--amber); border-radius: 999px; padding: 1px 10px; font-weight: 600; font-size: 12px; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; }
@media (max-width: 640px) { .board { height: auto; min-height: 0; } .feed { overflow: visible; flex: none; } .day { top: 0; position: static; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

    <div class="feed" id="feed"></div>
    <div class="foot" id="foot"></div>
  </section>
  <p class="note" data-i="note"></p>
</div>

  var DEMO = [
    { id: 1, level: "yellow", status: "reported", title: "เตือน ปิดถนน เบี่ยงจราจร ‘วิภาวดีฯ’ ยาว 2 เดือน สร้างรถไฟฟ้าสายสีส้ม", source_name: "bangkokbiznews", published_at: ago(26), line: "สายสีส้ม" },
    { id: 2, level: "yellow", status: "reported", title: "BEM รับรถไฟฟ้า “สายสีส้ม” ล็อตแรก พ.ย.นี้! จ่อเปิด ม.ค.71", source_name: "LINE TODAY", published_at: ago(40), line: "สายสีส้ม", is_update: 1, delta: "ตัวอย่าง: มีกำหนดรับขบวนรถล็อตแรกเดือนพฤศจิกายน" },
    { id: 3, level: "yellow", status: "reported", title: "‘สายสีส้ม’ น้ำท่วมที่ดินราดตก ลุ้นดินรถปลุกอสังหา-ห้างใหม่", source_name: "ประชาชาติธุรกิจ", published_at: ago(20), line: "สายสีส้ม" },
    { id: 4, level: "grey", status: "reported", title: "BEM Art Training สำหรับน้อง ม.ปลาย คอร์สที่ 2 เปิดรับสมัครแล้ว", source_name: "The Bangkok Insight", published_at: ago(44) },
    { id: 5, level: "grey", status: "reported", title: "รฟม. รวมพลังผู้บริหาร-พนักงาน จัดกิจกรรมจิตอาสาพัฒนาสวนสุขภาพ", source_name: "BiztalkNEWS", published_at: ago(30) }
  ];

  var S = { items: DEMO, demo: true, generated: null, cat: "all", q: "", from: "", to: "", src: "", sort: "desc", dropped: false, lang: "th" };
  var $ = function (id) { return document.getElementById(id); };
  var T = function () { return TXT[S.lang]; };

  try { var sl = localStorage.getItem(LSTORE); if (sl === "th" || sl === "en") S.lang = sl; else if (!/^th/i.test(navigator.language || "th")) S.lang = "en"; } catch (e) {}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function when(it) { return it.published_at || it.fetched_at || ""; }
  function ymd(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" }); }
  function loc() { return S.lang === "th" ? "th-TH" : "en-GB"; }
  function fDay(iso) { var d = new Date(iso); return isNaN(d) ? T().unk : d.toLocaleDateString(loc(), { weekday: "short", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Bangkok" }); }
  function fTime(iso) { var d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Bangkok" }) + (S.lang === "th" ? " น." : ""); }
  function isDropped(it) { return it.status === "irrelevant" || it.status === "excluded"; }
  function lv(it) { return isDropped(it) ? "grey" : (it.level || "grey"); }
  function related(it) {
    try { var r = typeof it.related_urls === "string" ? JSON.parse(it.related_urls || "[]") : (it.related_urls || []); return r.map(safeUrl).filter(Boolean); }
    catch (e) { return []; }
  }

  // โลโก้: ใช้ logo.png ที่อัปโหลดไว้ใน repo ถ้าไม่มีจะแสดงรูปสำรองแบบง่าย
  var MASCOT = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 14c6-8 16-8 22-4-4 8-12 10-20 8z" fill="#6BA36A"/><ellipse cx="50" cy="58" rx="34" ry="32" fill="#9B7FD1"/><ellipse cx="50" cy="62" rx="26" ry="22" fill="#B9A2E8"/><circle cx="39" cy="55" r="4" fill="#2A1B4D"/><circle cx="61" cy="55" r="4" fill="#2A1B4D"/><path d="M42 67q8 7 16 0" stroke="#2A1B4D" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="31" cy="64" r="4" fill="#F4A6C0" opacity=".8"/><circle cx="69" cy="64" r="4" fill="#F4A6C0" opacity=".8"/></svg>';
  (function () {
    var im = $("logoimg"), fb = function () { $("logo").innerHTML = MASCOT; };
    im.addEventListener("error", fb);
    if (im.complete && im.naturalWidth === 0) fb();
  })();

  try {
    var raw = localStorage.getItem(STORE);
    if (raw) { var o = JSON.parse(raw); if (o && Array.isArray(o.items) && o.items.length) { S.items = o.items; S.generated = o.generated_at || null; S.demo = false; } }
  } catch (e) {}

  function accept(text) {
    var o = JSON.parse(text), items = Array.isArray(o) ? o : o.items;
    if (!Array.isArray(items)) throw new Error("bad format");
    S.items = items; S.generated = (o && o.generated_at) || null; S.demo = false;
    try { localStorage.setItem(STORE, JSON.stringify({ generated_at: S.generated, items: items })); } catch (e) {}
    render();
  }

  function matched() {
    var q = S.q.trim().toLowerCase();
    return S.items.filter(function (it) {
      if (isDropped(it) && !S.dropped) return false;
      var d = ymd(when(it));
      if (S.from && (!d || d < S.from)) return false;
      if (S.to && (!d || d > S.to)) return false;
      if (S.src && (it.source_name || it.source) !== S.src) return false;
      if (q && ((it.title || "") + " " + (it.summary || "") + " " + (it.line || "") + " " + (it.station || "") + " " + (it.source_name || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function renderStatic() {
    var t = T();
    document.documentElement.lang = S.lang;
    document.querySelectorAll("[data-i]").forEach(function (el) { var v = t[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-iph]").forEach(function (el) { el.placeholder = t[el.getAttribute("data-iph")]; });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === S.lang)); });
    $("sort").innerHTML = '<option value="desc"' + (S.sort === "desc" ? " selected" : "") + ">" + esc(t.newest) + '</option><option value="asc"' + (S.sort === "asc" ? " selected" : "") + ">" + esc(t.oldest) + "</option>";
  }

  function renderHero() {
    var t = T(), cand = S.items.filter(function (it) { return !isDropped(it); })
      .sort(function (a, b) { return new Date(when(b)) - new Date(when(a)); })[0];
    var h = $("hero");
    if (!cand) { h.innerHTML = '<div class="empty">' + esc(t.noHero) + "</div>"; return; }
    var L = lv(cand), url = safeUrl(cand.url), img = safeUrl(cand.image);
    var rail = '<svg viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="22" y="10" width="76" height="52" rx="14"/><path d="M22 40h76"/><circle cx="40" cy="52" r="3" fill="currentColor"/><circle cx="80" cy="52" r="3" fill="currentColor"/><path d="M34 62l-10 18M86 62l10 18M42 80h36"/></svg>';
    var pic = '<div class="hero-pic">' + (img ? '<img class="photo" alt="" src="' + esc(img) + '">' : '<div class="art">' + rail + "</div>") +
      '<div class="cap">' + esc(t.source) + ": " + esc(cand.source_name || cand.source || "-") + " · " + esc(fDay(when(cand))) + " " + esc(fTime(when(cand))) + "</div></div>";
    var upd = cand.is_update && cand.delta ? '<div class="upd"><b>' + esc(t.progress) + ":</b> " + esc(cand.delta) + "</div>" : "";
    var go = url ? '<a class="go" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.open) + "</a>" : "";
    h.innerHTML = '<div class="hero ' + L + '">' + pic + '<div class="hero-body"><div class="kicker"><span class="pill">' + esc(t.latest) + "</span><span>" + esc(t.lvl[L]) + "</span></div>" +
      "<h2>" + esc(cand.title) + "</h2>" + upd + go + "</div></div>";
  }

  function render() {
    var t = T();
    renderStatic(); renderHero();
    var base = matched(), counts = { all: base.length, red: 0, yellow: 0, green: 0, grey: 0 };
    base.forEach(function (it) { var k = lv(it); if (counts[k] != null) counts[k]++; });
    $("tabs").innerHTML = CATS.map(function (c) {
      return '<button type="button" class="tab" data-c="' + c + '" aria-pressed="' + (S.cat === c) + '"><span class="dot d-' + c + '"></span>' + esc(t.cats[c]) + ' <span class="n">' + counts[c] + "</span></button>";
    }).join("");

    var srcs = {}; S.items.forEach(function (it) { var s = it.source_name || it.source; if (s) srcs[s] = 1; });
    $("src").innerHTML = '<option value="">' + esc(t.allSrc) + "</option>" + Object.keys(srcs).sort().map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === S.src ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("");

    var shown = base.filter(function (it) { return S.cat === "all" || lv(it) === S.cat; });
    shown.sort(function (a, b) { var d = new Date(when(b)) - new Date(when(a)); return S.sort === "asc" ? -d : d; });
    $("count").textContent = t.found(shown.length);
    $("foot").innerHTML = S.demo ? '<span class="badge">' + esc(t.demo) + "</span> " + esc(t.demoMsg)
      : esc(t.updated) + " " + (S.generated ? esc(fDay(S.generated) + " " + fTime(S.generated)) : "-") + " · " + esc(t.total) + " " + S.items.length + " " + esc(t.items);

    var feed = $("feed");
    if (!shown.length) { feed.innerHTML = '<div class="empty"><b>' + esc(t.empty1) + "</b>" + esc(t.empty2) + "</div>"; return; }
    var html = "", last = "";
    shown.forEach(function (it) {
      var day = fDay(when(it)); if (day !== last) { html += '<div class="day">' + esc(day) + "</div>"; last = day; }
      var url = safeUrl(it.url), rel = related(it), L = lv(it);
      var title = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a>" : esc(it.title);
      var sum = it.summary && it.summary.trim() !== (it.title || "").trim() ? "<p>" + esc(it.summary) + "</p>" : "";
      var upd = it.is_update && it.delta ? '<div class="upd2"><b>' + esc(t.progress) + ":</b> " + esc(it.delta) + "</div>" : "";
      var tags = (it.line ? "<span>" + esc(it.line) + "</span>" : "") + (it.station ? "<span>" + esc(t.station) + esc(it.station) + "</span>" : "");
      var more = rel.length ? '<div class="rel">' + esc(t.more) + ": " + rel.map(function (u, i) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + (i + 1) + "</a>"; }).join(" · ") + "</div>" : "";
      var note = url ? "" : '<div class="rel"><i>' + esc(t.nolink) + "</i></div>";
      html += '<article class="item ' + L + (isDropped(it) ? " dropped" : "") + '"><div class="lvl"><span class="dot d-' + L + '"></span>' + esc(isDropped(it) ? t.dropTag : t.lvl[L]) + "</div>" +
        "<h3>" + title + "</h3>" + '<div class="meta"><span>' + esc(it.source_name || it.source || "") + "</span><span>" + esc(fTime(when(it))) + "</span>" + tags + "</div>" + sum + upd + more + note + "</article>";
    });
    feed.innerHTML = html;
  }

  $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) { S.cat = b.getAttribute("data-c"); render(); $("feed").scrollTop = 0; } });
  $("q").addEventListener("input", function (e) { S.q = e.target.value; render(); });
  $("from").addEventListener("change", function (e) { S.from = e.target.value; render(); });
  $("to").addEventListener("change", function (e) { S.to = e.target.value; render(); });
  $("src").addEventListener("change", function (e) { S.src = e.target.value; render(); });
  $("sort").addEventListener("change", function (e) { S.sort = e.target.value; render(); });
  $("dropped").addEventListener("change", function (e) { S.dropped = e.target.checked; render(); });
  document.querySelector(".row2").addEventListener("click", function (e) {
    var b = e.target.closest("[data-range]"); if (!b) return;
    var n = +b.getAttribute("data-range");
    if (!n) { S.from = ""; S.to = ""; } else { S.to = ymd(new Date().toISOString()); S.from = ymd(new Date(Date.now() - (n - 1) * 86400e3).toISOString()); }
    $("from").value = S.from; $("to").value = S.to; render();
  });
  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]"); if (!b) return; S.lang = b.getAttribute("data-lang");
    try { localStorage.setItem(LSTORE, S.lang); } catch (er) {} render();
  });
  $("theme").addEventListener("click", function () {
    var root = document.documentElement, dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  function fetchNews() {
    fetch("news.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(accept).catch(function () {});
  }
  render(); fetchNews(); setInterval(fetchNews, 10 * 60 * 1000);
})();
</script>
</body>
</html>
